<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Short for a Nation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #FFD700;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .top-spacer {
            flex: 1;
        }

        .main-content {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: #FFD700;
        }

        p.subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #E6B800;
        }

        footer {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #FFD700;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: #FFFFFF;
        }

        .copyright {
            font-size: 0.8rem;
            color: #666666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="top-spacer"></div>

    <div class="main-content">
        <h1>One Short for a Nation</h1>
        <p class="subtitle">Diverse Stories - Diverse Countries</p>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#" target="_blank" rel="noopener noreferrer">FilmFreeway Profile</a>
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
        </div>
        <p class="copyright">&copy; 2026 One Short for a Nation. All rights reserved.</p>
    </footer>

</body>
</html>
